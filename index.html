<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127956;</text></svg>">
<title>북한산장 원가 계산기</title>
<style>
  /* 라이트 전용 — 뷰어가 다크로 토글해도 이 팔레트를 유지합니다 */
  :root,
  :root[data-theme="dark"],
  :root[data-theme="light"]{
    --bg:#F7F7F4;
    --card:#FFFFFF;
    --card-2:#FAFAF8;
    --line:#EBEAE5;
    --line-2:#DEDCD5;
    --t1:#1A1917;
    --t2:#57544D;
    --t3:#8A867D;
    --t4:#B3AFA6;
    --accent:#2F5FD8;
    --accent-bg:#EDF2FE;
    --accent-line:#C6D5F8;
    --ok:#0F7F58;
    --ok-bg:#E6F4EE;
    --warn:#A86B04;
    --warn-bg:#FBF0D9;
    --bad:#BE3A2E;
    --bad-bg:#FBE9E6;
    --font:-apple-system,BlinkMacSystemFont,Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--t1);
    font-family:var(--font);font-size:14px;line-height:1.55;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em;
  }
  .num{font-variant-numeric:tabular-nums;font-family:var(--mono);}
  .muted{color:var(--t4);}
  .wrap{max-width:1200px;margin:0 auto;padding:0 20px 80px;}

  /* ---------- top nav ---------- */
  .topnav{
    position:sticky;top:0;z-index:20;background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .topnav-in{
    max-width:1200px;margin:0 auto;padding:11px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .brand{
    font-size:15px;font-weight:750;letter-spacing:-.03em;flex:none;
    padding-right:4px;
  }
  .brand small{
    display:block;font-size:11px;font-weight:500;color:var(--t4);
    letter-spacing:-.01em;margin-top:-1px;
  }
  .lede{
    color:var(--t3);font-size:13px;margin:0;
    padding:22px 4px 16px;
  }

  /* ---------- bento kpi ---------- */
  .bento{
    display:grid;gap:12px;margin-bottom:22px;
    grid-template-columns:repeat(4,1fr);
  }
  .tile{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  }
  .tile.wide{grid-column:span 2;}
  .tile dt{font-size:12px;color:var(--t3);font-weight:600;margin:0;}
  .tile dd{margin:0;font-size:30px;font-weight:750;letter-spacing:-.04em;font-family:var(--mono);line-height:1.05;}
  .tile.sm dd{font-size:22px;}
  .tile dd small{font-size:13px;font-weight:600;color:var(--t3);margin-left:3px;font-family:var(--font);letter-spacing:-.01em;}
  .tile .note{font-size:12px;color:var(--t3);}
  .spark{display:flex;gap:3px;align-items:flex-end;height:34px;}
  .spark i{flex:1;border-radius:2px 2px 0 0;background:var(--accent-line);min-height:3px;}
  .spark i.ok{background:#9CCBB7;}.spark i.warn{background:#E4C083;}.spark i.bad{background:#E5A69D;}

  /* ---------- toolbar ---------- */
  .tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;}
  .tabs button{
    border:0;background:transparent;color:var(--t3);font-family:inherit;
    font-size:13px;font-weight:650;padding:6px 13px;border-radius:9px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .tabs button:hover{color:var(--t1);}
  .tabs button[aria-current="true"]{background:var(--accent-bg);color:var(--accent);}
  .tabs .cnt{font-family:var(--mono);font-size:11px;opacity:.7;}
  .spacer{flex:1;}
  .search{
    display:flex;align-items:center;gap:7px;background:var(--bg);
    border:1px solid var(--line);border-radius:11px;padding:6px 11px;min-width:170px;
  }
  .search input{border:0;background:transparent;font-family:inherit;font-size:13px;
    color:var(--t1);width:100%;outline:0;}
  .search svg{flex:none;color:var(--t4);}
  .btn{
    border:1px solid var(--line);background:var(--bg);color:var(--t2);
    font-family:inherit;font-size:12.5px;font-weight:650;
    padding:6px 12px;border-radius:11px;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--card-2);color:var(--t1);}
  .btn[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent-line);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#2751BE;color:#fff;}
  .btn:focus-visible,.tabs button:focus-visible,input:focus-visible,.card-top:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* ---------- grids ---------- */
  .grid{display:grid;gap:12px;align-items:start;}
  .grid.menus{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
  .grid.batches{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));}
  .grid.ings{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));}
  .gh{
    font-size:12px;font-weight:700;color:var(--t3);
    margin:20px 4px 10px;letter-spacing:.01em;
    display:flex;align-items:center;gap:8px;
  }
  .gh:first-child{margin-top:6px;}
  .gh span{font-family:var(--mono);font-weight:600;color:var(--t4);font-size:11px;}

  /* category chips */
  .chips{
    display:flex;gap:6px;overflow-x:auto;padding:20px 2px 14px;
    margin:0 -2px;scrollbar-width:thin;
  }
  .chips::-webkit-scrollbar{height:5px;}
  .chips::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;}
  .chips button{
    flex:none;border:1px solid var(--line);background:var(--card);color:var(--t2);
    font-family:inherit;font-size:12.5px;font-weight:650;
    padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
  }
  .chips button:hover{background:var(--card-2);color:var(--t1);}
  .chips button b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--t4);}
  .chips button[aria-pressed="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .chips button[aria-pressed="true"] b{color:rgba(255,255,255,.72);}
  .chips button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .chips .dot{
    width:6px;height:6px;border-radius:99px;background:var(--warn);flex:none;
  }
  .chips button[aria-pressed="true"] .dot{background:#fff;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;
  }
  .card.on{border-color:var(--accent-line);}
  .card-top{
    width:100%;border:0;background:transparent;font-family:inherit;color:inherit;
    text-align:left;padding:16px 18px;cursor:pointer;display:block;
  }
  .card-top:hover{background:var(--card-2);}
  .ct-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .ct-name{font-size:15px;font-weight:700;letter-spacing:-.02em;line-height:1.3;}
  .ct-name small{display:block;font-size:11.5px;font-weight:500;color:var(--t4);margin-top:1px;}
  .ct-cost{display:flex;align-items:baseline;gap:5px;margin-top:12px;}
  .ct-cost b{font-size:25px;font-weight:750;letter-spacing:-.04em;font-family:var(--mono);}
  .ct-cost i{font-style:normal;font-size:12.5px;color:var(--t3);font-weight:600;}
  .track{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:11px;}
  .track i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .25s;}
  .track i.warn{background:var(--warn);}.track i.bad{background:var(--bad);}.track i.wait{background:var(--t4);}
  .ct-foot{
    display:flex;gap:14px;margin-top:11px;font-size:12px;color:var(--t3);
    align-items:center;flex-wrap:wrap;
  }
  .ct-foot b{font-family:var(--mono);color:var(--t2);font-weight:650;font-variant-numeric:tabular-nums;}
  .ct-more{margin-left:auto;color:var(--accent);font-weight:650;font-size:12px;}

  .tag{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 7px;border-radius:7px;white-space:nowrap;}
  .t-ok{background:var(--ok-bg);color:var(--ok);}
  .t-warn{background:var(--warn-bg);color:var(--warn);}
  .t-bad{background:var(--bad-bg);color:var(--bad);}
  .t-wait{background:var(--card-2);color:var(--t3);border:1px solid var(--line);}
  .t-sub{background:var(--accent-bg);color:var(--accent);font-size:10.5px;padding:1px 5px;}

  .body{display:none;padding:0 18px 16px;border-top:1px solid var(--line);}
  .card.on .body{display:block;}
  .ln{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .ln:last-of-type{border-bottom:0;}
  .ln-nm{flex:1;min-width:0;font-size:13px;font-weight:600;}
  .ln-nm small{display:block;font-size:11px;color:var(--t4);font-weight:400;margin-top:-1px;}
  .ln-amt{display:flex;align-items:center;gap:4px;flex:none;}
  .ln-cost{min-width:64px;text-align:right;font-size:13px;font-weight:650;
    font-family:var(--mono);font-variant-numeric:tabular-nums;flex:none;}
  .ln-cost.muted{font-size:11px;font-weight:500;}
  .sum{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin-top:10px;padding-top:11px;border-top:1.5px solid var(--line-2);
    font-weight:750;font-size:14px;
  }
  .hint{
    font-size:11.5px;color:var(--t3);background:var(--card-2);
    border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-top:11px;line-height:1.5;
  }
  .hint b{color:var(--t2);}

  /* ingredient card */
  .ic{padding:15px 16px;display:flex;flex-direction:column;gap:11px;}
  .ic-nm{font-size:13.5px;font-weight:700;letter-spacing:-.02em;line-height:1.3;}
  .ic-val{display:flex;align-items:baseline;gap:4px;}
  .ic-val b{font-size:21px;font-weight:750;font-family:var(--mono);letter-spacing:-.03em;}
  .ic-val i{font-style:normal;font-size:11.5px;color:var(--t3);font-weight:600;}
  .ic-in{display:flex;gap:7px;}
  .fld{flex:1;min-width:0;}
  .fld label{display:block;font-size:10.5px;color:var(--t3);font-weight:650;margin-bottom:3px;}
  .in{
    font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;
    color:var(--t1);background:var(--card-2);border:1.5px solid var(--line);
    border-radius:9px;padding:7px 9px;width:100%;text-align:right;
  }
  .in:hover{border-color:var(--line-2);}
  .in:focus{outline:0;border-color:var(--accent);background:var(--card);
    box-shadow:0 0 0 3px var(--accent-bg);}
  .in::placeholder{color:var(--t4);font-family:var(--font);font-size:12px;}
  .in.s{width:66px;text-align:right;padding:5px 8px;}
  .u{font-size:11px;color:var(--t4);font-weight:600;min-width:16px;}

  .empty{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:44px 20px;text-align:center;color:var(--t3);font-size:13.5px;
  }

  .acts{display:flex;gap:7px;flex-wrap:wrap;}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);z-index:100;
    background:var(--t1);color:#fff;font-size:12.5px;font-weight:650;
    padding:9px 16px;border-radius:11px;opacity:0;pointer-events:none;transition:.18s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  @media (max-width:820px){
    .bento{grid-template-columns:repeat(2,1fr);}
    .tile.wide{grid-column:span 2;}
    .search{order:3;flex:1 1 100%;min-width:0;}
    .spacer{display:none;}
  }
  @media (max-width:520px){
    .wrap{padding:0 14px 70px;}
    .topnav-in{padding:10px 14px;gap:8px;}
    .brand{font-size:14px;}
    .brand small{display:none;}
    .tabs{flex:1 1 auto;}
    .tabs button{flex:1;justify-content:center;padding:6px 8px;}
    .bento{grid-template-columns:1fr;}
    .tile.wide{grid-column:span 1;}
    .grid.ings{grid-template-columns:1fr 1fr;}
    .lede{padding:16px 2px 14px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="topnav">
  <div class="topnav-in">
    <span class="brand">북한산장 원가<small>계산기</small></span>
    <nav class="tabs" id="tabs">
      <button data-view="menu" aria-current="true">메뉴 <span class="cnt" id="c-menu"></span></button>
      <button data-view="batch" aria-current="false">반제품 <span class="cnt" id="c-batch"></span></button>
      <button data-view="ing" aria-current="false">재료 <span class="cnt" id="c-ing"></span></button>
    </nav>
    <span class="spacer"></span>
    <label class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.7"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <input type="text" id="q" placeholder="이름으로 찾기" aria-label="검색">

    <button class="btn" id="fSort" aria-pressed="false">원가율순</button>
  </div>
</header>

<div class="wrap">
  <div id="dash">
  <p class="lede">재료값을 고치면 반제품과 메뉴 원가가 바로 다시 계산됩니다</p>

  <dl class="bento">
    <div class="tile wide">

      <div class="note" id="k2n">—</div>
    </div>
    <div class="tile sm">

      <dd id="k3">—</dd>
      <div class="note" id="k3n">채우면 원가가 완성돼요</div>
    </div>
    <div class="tile sm wide">
      <dt>가장 원가율 높은 메뉴</dt>
      <dd id="k4">—</dd>
      <div class="note" id="k4n">—</div>
    </div>
    <div class="tile sm wide">
      <dt>가장 여유 있는 메뉴</dt>
      <dd id="k5">—</dd>
      <div class="note" id="k5n">—</div>
    </div>
  </dl>
  </div>

  <main id="view"></main>

  <div class="acts" style="margin-top:20px;padding:0 4px">
    <button class="btn" id="reset">기본값으로 되돌리기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

  var KEY="bhsj-cost-v2";
  var S=null, view="menu", open={}, q="", onlyMiss=false, sortRate=false, ingCat=null;

  function seed(){
    var ing={};
    SEED_ING.forEach(function(r){ ing[r[0]]={name:r[1],cat:r[2],price:r[3],qty:r[4],unit:r[5]}; });
    return {
      ing:ing,
      batch:SEED_BATCH.map(function(b){
        return {id:b[0],name:b[1],yield:b[2],
          items:b[3].map(function(x){return {ing:x[0],amt:x[1],note:x[2]};})};
      }),
      menu:SEED_MENU.map(function(m){
        return {id:m[0],name:m[1],cat:m[2],price:m[3],
          items:m[4].map(function(x){return {kind:x[0],ref:x[1],amt:x[2],note:x[3]};})};
      })
    };
  }

  function unitCost(id){
    var g=S.ing[id];
    if(!g||g.price===null||g.qty===null||!g.qty) return null;
    return g.price/g.qty;
  }
  function batchById(id){
    for(var i=0;i<S.batch.length;i++) if(S.batch[i].id===id) return S.batch[i];
    return null;
  }
  function batchCalc(b){
    var cost=0,weight=0,miss=0;
    b.items.forEach(function(it){
      var u=unitCost(it.ing);
      if(it.amt===null||u===null){ if(it.amt!==0) miss++; }
      if(it.amt!==null) weight+=it.amt;
      if(it.amt!==null&&u!==null) cost+=it.amt*u;
    });
    return {cost:cost,weight:weight,miss:miss,perG:weight?cost/weight:null};
  }
  function lineUnit(it){
    if(it.kind==="b"){ var b=batchById(it.ref); if(!b) return null;
      var c=batchCalc(b); return c.miss?null:c.perG; }
    return unitCost(it.ref);
  }
  function lineName(it){
    if(it.kind==="b"){ var b=batchById(it.ref); return b?b.name:it.ref; }
    var g=S.ing[it.ref]; return g?g.name:it.ref;
  }
  function lineUnitLabel(it){
    if(it.kind==="b") return "g";
    var g=S.ing[it.ref]; return g?g.unit:"";
  }
  function menuCalc(m){
    var cost=0,miss=0;
    m.items.forEach(function(it){
      var u=lineUnit(it);
      if(it.amt===null||u===null){ miss++; return; }
      cost+=it.amt*u;
    });
    return {cost:cost,miss:miss,rate:(m.price&&!miss)?cost/m.price:null};
  }
  function tone(r){ return r===null?"wait":(r<0.20?"ok":(r<0.35?"warn":"bad")); }
  function toneWord(t){ return t==="ok"?"양호":t==="warn"?"주의":"높음"; }
  function won(n,d){
    if(n===null||n===undefined||isNaN(n)) return "—";
    d=d===undefined?0:d;
    return n.toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
  }
  function fmtUnit(u){
    if(u===null) return "—";
    if(Math.abs(u-Math.round(u))<1e-9) return won(Math.round(u),0);
    if(u<10) return won(u,2);
    if(u<100) return won(u,1);
    return won(u,0);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function hit(n){ return !q || n.toLowerCase().indexOf(q.toLowerCase())>=0; }

  /* ---------- persistence ---------- */
  function buildDiff(){
    var base=seed(), d={i:{},b:{},m:{}};
    Object.keys(S.ing).forEach(function(id){
      var a=S.ing[id],o=base.ing[id];
      if(o&&(a.price!==o.price||a.qty!==o.qty)) d.i[id]=[a.price,a.qty];
    });
    S.batch.forEach(function(bt,bi){
      var ob=base.batch[bi]; if(!ob) return; var e={};
      bt.items.forEach(function(it,j){ if(ob.items[j]&&it.amt!==ob.items[j].amt) e[j]=it.amt; });
      if(Object.keys(e).length) d.b[bt.id]=e;
    });
    S.menu.forEach(function(m,mi){
      var om=base.menu[mi]; if(!om) return; var e={},a={};
      if(m.price!==om.price) e.p=m.price;
      m.items.forEach(function(it,j){ if(om.items[j]&&it.amt!==om.items[j].amt) a[j]=it.amt; });
      if(Object.keys(a).length) e.a=a;
      if(Object.keys(e).length) d.m[m.id]=e;
    });
    return d;
  }
  function applyDiff(d){
    var s=seed();
    if(d.i) Object.keys(d.i).forEach(function(id){
      if(s.ing[id]){ s.ing[id].price=d.i[id][0]; s.ing[id].qty=d.i[id][1]; }});
    if(d.b) s.batch.forEach(function(bt){
      var e=d.b[bt.id]; if(!e) return;
      Object.keys(e).forEach(function(j){ if(bt.items[+j]) bt.items[+j].amt=e[j]; });});
    if(d.m) s.menu.forEach(function(m){
      var e=d.m[m.id]; if(!e) return;
      if(Object.prototype.hasOwnProperty.call(e,"p")) m.price=e.p;
      if(e.a) Object.keys(e.a).forEach(function(j){ if(m.items[+j]) m.items[+j].amt=e.a[j]; });});
    return s;
  }
  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){ var p=JSON.parse(raw); if(p&&p.v===2&&p.d) return applyDiff(p.d); }
    }catch(e){}
    return seed();
  }
  var saveT=null;
  function save(){
    clearTimeout(saveT);
    saveT=setTimeout(function(){
      try{ localStorage.setItem(KEY,JSON.stringify({v:2,d:buildDiff()})); toast("저장됨"); }
      catch(e){ toast("이 브라우저에선 저장이 안 돼요"); }
    },400);
  }
  var toastT=null;
  function toast(m){
    var el=document.getElementById("toast");
    el.textContent=m; el.classList.add("on");
    clearTimeout(toastT);
    toastT=setTimeout(function(){ el.classList.remove("on"); },1500);
  }

  /* ---------- render ---------- */
  function lineRow(nameHtml,inputHtml,unitLbl,costKey,cost){

      '<span class="ln-amt">'+inputHtml+'<span class="u">'+esc(unitLbl)+'</span></span>'+
      '<span class="ln-cost'+(cost===null?' muted':'')+'" data-o="'+costKey+'">'+
      (cost===null?'단가 없음':won(Math.round(cost)))+'</span></div>';
  }

  function menuCard(m){
    var c=menuCalc(m), t=tone(c.rate), on=open["m"+m.id];
    var pct=c.rate===null?0:Math.min(100,c.rate*100);

    h+='<button class="card-top" data-tog="m'+m.id+'" aria-expanded="'+(on?'true':'false')+'">';
    h+='<span class="ct-head"><span class="ct-name">'+esc(m.name)+
       '<small>'+esc(m.cat)+'</small></span>';
    h+='<span class="tag t-'+(c.miss?'wait':t)+'" data-o="tg-m'+m.id+'">'+
       (c.miss?('미입력 '+c.miss):(c.rate===null?'판매가 없음':toneWord(t)))+'</span></span>';
    h+='<span class="ct-cost"><b class="num" data-o="mc-'+m.id+'">'+
       (c.cost?won(Math.round(c.cost)):'—')+'</b><i>원 · 원가</i></span>';
    h+='<span class="track"><i class="'+t+'" data-o="bar-m'+m.id+'" style="width:'+pct+'%"></i></span>';
    h+='<span class="ct-foot"><span>원가율 <b data-o="rv-m'+m.id+'">'+
       (c.rate===null?'—':(c.rate*100).toFixed(1)+'%')+'</b></span>';
    h+='<span>마진 <b data-o="mm-'+m.id+'">'+
       ((m.price&&!c.miss)?won(Math.round(m.price-c.cost)):'—')+'</b></span>';
    h+='<span class="ct-more" data-n="재료 '+m.items.length+'">'+
       (on?'접기':'재료 '+m.items.length)+'</span></span>';
    h+='</button>';

    h+='<div class="body">';
    m.items.forEach(function(it,idx){
      var u=lineUnit(it), lc=(it.amt!==null&&u!==null)?it.amt*u:null;
      var nm=esc(lineName(it))+(it.kind==="b"?' <span class="tag t-sub">반제품</span>':'')+
        (it.note?'<small>'+esc(it.note)+'</small>':'')+
        '<small class="num" data-o="ml-u-'+m.id+'-'+idx+'">'+
        (u===null?'단가 미입력':fmtUnit(u)+'원/'+esc(lineUnitLabel(it)))+'</small>';
      var inp='<input class="in s" type="text" inputmode="decimal" value="'+
        (it.amt===null?"":it.amt)+'" placeholder="?" data-mi="'+m.id+'" data-idx="'+idx+
        '" aria-label="'+esc(lineName(it))+' 사용량">';
      h+=lineRow(nm,inp,lineUnitLabel(it),"ml-c-"+m.id+"-"+idx,lc);
    });
    h+='<div class="sum"><span>원가 합계</span><span class="num" data-o="mf-'+m.id+'">'+
       (c.cost?won(Math.round(c.cost))+'원':'—')+'</span></div>';
    h+='<div class="ic-in" style="margin-top:12px"><div class="fld"><label>판매가</label>'+
       '<input class="in" type="text" inputmode="numeric" value="'+(m.price===null?"":m.price)+
       '" placeholder="미정" data-price="'+m.id+'" aria-label="'+esc(m.name)+' 판매가"></div></div>';
    if(c.miss) h+='<div class="hint">재료 <b>'+c.miss+'개</b>의 단가나 사용량이 비어 있어 아직 부분값입니다.</div>';
    h+='</div></article>';
    return h;
  }

  function menuView(){
    var rows=S.menu.filter(function(m){
      if(!hit(m.name)) return false;
      if(onlyMiss){ var c=menuCalc(m); if(c.miss===0&&c.rate!==null) return false; }
      return true;
    });
    if(!rows.length) return emptyBox();
    if(sortRate){
      rows=rows.slice().sort(function(a,b){
        var ra=menuCalc(a).rate, rb=menuCalc(b).rate;
        if(ra===null) return 1; if(rb===null) return -1; return rb-ra;
      });
      return '<div class="gh">원가율 높은 순 <span>'+rows.length+'</span></div>'+
        '<div class="grid menus">'+rows.map(menuCard).join("")+'</div>';
    }
    var cats=[],by={};
    rows.forEach(function(m){ if(!by[m.cat]){by[m.cat]=[];cats.push(m.cat);} by[m.cat].push(m); });
    return cats.map(function(cat){
      return '<div class="gh">'+esc(cat)+' <span>'+by[cat].length+'</span></div>'+
        '<div class="grid menus">'+by[cat].map(menuCard).join("")+'</div>';
    }).join("");
  }

  function batchView(){
    var rows=S.batch.filter(function(b){
      if(!hit(b.name)) return false;
      if(onlyMiss && batchCalc(b).miss===0) return false;
      return true;
    });

    var cards=rows.map(function(b){
      var c=batchCalc(b), on=open["b"+b.id];
      var h='<article class="card'+(on?' on':'')+'" data-card="b'+b.id+'">';
      h+='<button class="card-top" data-tog="b'+b.id+'" aria-expanded="'+(on?'true':'false')+'">';

      h+='<span class="ct-cost"><b class="num" data-o="bp-'+b.id+'">'+
         ((c.miss||!c.perG)?'—':won(c.perG,2))+'</b><i>원 · 1g당</i></span>';
      h+='<span class="ct-foot"><span>완성 <b data-o="bw-'+b.id+'">'+won(c.weight,1)+'</b>g</span>';

      h+='<span class="ct-more" data-n="재료 '+b.items.length+'">'+
         (on?'접기':'재료 '+b.items.length)+'</span></span></button>';
      h+='<div class="body">';
      b.items.forEach(function(it,idx){
        var u=unitCost(it.ing), lc=(it.amt!==null&&u!==null)?it.amt*u:null;
        var nm=esc(S.ing[it.ing]?S.ing[it.ing].name:it.ing)+
          (it.note?'<small>'+esc(it.note)+'</small>':'')+
          '<small class="num" data-o="bl-u-'+b.id+'-'+idx+'">'+
          (u===null?'단가 미입력':fmtUnit(u)+'원/g')+'</small>';
        var inp='<input class="in s" type="text" inputmode="decimal" value="'+
          (it.amt===null?"":it.amt)+'" placeholder="?" data-bi="'+b.id+'" data-idx="'+idx+
          '" aria-label="사용량">';
        h+=lineRow(nm,inp,"g","bl-c-"+b.id+"-"+idx,lc);

      h+='</div></article>';

    }).join("");
    return '<div class="gh">배치로 만들어 조금씩 쓰는 소스·페스토 <span>'+rows.length+'</span></div>'+
      '<div class="grid batches">'+cards+'</div>';
  }

  function ingChips(){
    var all=Object.keys(S.ing), order=[], tally={};
    all.forEach(function(id){
      var c=S.ing[id].cat;
      if(!tally[c]){ tally[c]={n:0,miss:0}; order.push(c); }
      tally[c].n++;
      if(unitCost(id)===null) tally[c].miss++;
    });
    var totalMiss=0; all.forEach(function(id){ if(unitCost(id)===null) totalMiss++; });
    var h='<div class="chips" role="group" aria-label="재료 분류">';
    h+='<button data-cat="" aria-pressed="'+(ingCat===null?'true':'false')+'">'+
       (totalMiss?'<span class="dot"></span>':'')+'전체 <b>'+all.length+'</b></button>';
    order.forEach(function(c){
      h+='<button data-cat="'+esc(c)+'" aria-pressed="'+(ingCat===c?'true':'false')+'">'+
        (tally[c].miss?'<span class="dot"></span>':'')+esc(c)+' <b>'+tally[c].n+'</b></button>';
    });
    return h+'</div>';
  }

  function ingView(){
    var ids=Object.keys(S.ing).filter(function(id){
      if(ingCat!==null && S.ing[id].cat!==ingCat) return false;
      if(!hit(S.ing[id].name)) return false;
      if(onlyMiss && unitCost(id)!==null) return false;
      return true;
    });
    if(!ids.length) return ingChips()+emptyBox();
    var cats=[],by={};
    ids.forEach(function(id){ var c=S.ing[id].cat;
      if(!by[c]){by[c]=[];cats.push(c);} by[c].push(id); });
    return ingChips()+cats.map(function(cat){
      var cards=by[cat].map(function(id){
        var g=S.ing[id], u=unitCost(id);
        return '<article class="card"><div class="ic">'+
          '<div class="ic-nm">'+esc(g.name)+'</div>'+
          '<div class="ic-val"><b class="num'+(u===null?' muted':'')+'" data-o="iu-'+id+'">'+
          fmtUnit(u)+'</b><i>원 / '+esc(g.unit)+'</i></div>'+
          '<div class="ic-in">'+
            '<div class="fld"><label>구매가</label><input class="in" type="text" inputmode="numeric" '+
              'value="'+(g.price===null?"":g.price)+'" placeholder="0" data-ip="'+id+'" '+
              'aria-label="'+esc(g.name)+' 구매가"></div>'+
            '<div class="fld"><label>총량 ('+esc(g.unit)+')</label><input class="in" type="text" inputmode="decimal" '+
              'value="'+(g.qty===null?"":g.qty)+'" placeholder="0" data-iq="'+id+'" '+
              'aria-label="'+esc(g.name)+' 총량"></div>'+
          '</div></div></article>';
      }).join("");
      var missN=0; by[cat].forEach(function(id){ if(unitCost(id)===null) missN++; });
      return '<div class="gh">'+esc(cat)+' <span>'+by[cat].length+
        (missN?' · 미입력 '+missN:'')+'</span></div><div class="grid ings">'+cards+'</div>';
    }).join("");
  }

  function emptyBox(){
    return '<div class="empty">'+(q?'‘'+esc(q)+'’와 맞는 항목이 없어요.':'표시할 항목이 없어요.')+'</div>';
  }

  /* ---------- targeted refresh ---------- */
  function set(k,txt,muted){
    var el=document.querySelector('[data-o="'+k+'"]');
    if(!el) return;
    el.textContent=txt;
    if(muted!==undefined) el.classList.toggle("muted",!!muted);
  }
  function refresh(){
    var rates=[],done=0,hi=null,hiN="",lo=null,loN="";
    S.menu.forEach(function(m){
      var c=menuCalc(m), t=tone(c.rate);
      set("mc-"+m.id, c.cost?won(Math.round(c.cost)):"—");
      set("mf-"+m.id, c.cost?won(Math.round(c.cost))+"원":"—");
      set("rv-m"+m.id, c.rate===null?"—":(c.rate*100).toFixed(1)+"%");
      set("mm-"+m.id, (m.price&&!c.miss)?won(Math.round(m.price-c.cost)):"—");
      var bar=document.querySelector('[data-o="bar-m'+m.id+'"]');
      if(bar){ bar.style.width=(c.rate===null?0:Math.min(100,c.rate*100))+"%"; bar.className=t; }
      var tg=document.querySelector('[data-o="tg-m'+m.id+'"]');
      if(tg){ tg.className="tag t-"+(c.miss?"wait":t);
        tg.textContent=c.miss?("미입력 "+c.miss):(c.rate===null?"판매가 없음":toneWord(t)); }
      m.items.forEach(function(it,idx){
        var u=lineUnit(it), lc=(it.amt!==null&&u!==null)?it.amt*u:null;
        set("ml-u-"+m.id+"-"+idx, u===null?"단가 미입력":fmtUnit(u)+"원/"+lineUnitLabel(it));
        set("ml-c-"+m.id+"-"+idx, lc===null?"단가 없음":won(Math.round(lc)), lc===null);
      });
      if(c.rate!==null){ rates.push(c.rate); done++;
        if(hi===null||c.rate>hi){hi=c.rate;hiN=m.name;}
        if(lo===null||c.rate<lo){lo=c.rate;loN=m.name;} }
    });
    S.batch.forEach(function(b){
      var c=batchCalc(b);
      set("bw-"+b.id, won(c.weight,1));
      set("bc-"+b.id, c.miss?"—":won(Math.round(c.cost)));
      set("bp-"+b.id, (c.miss||!c.perG)?"—":won(c.perG,2), c.miss);
      var tg=document.querySelector('[data-o="bt-'+b.id+'"]');
      if(tg){ tg.className="tag "+(c.miss?"t-wait":"t-ok");
        tg.textContent=c.miss?("미입력 "+c.miss):"확정"; }
      b.items.forEach(function(it,idx){
        var u=unitCost(it.ing), lc=(it.amt!==null&&u!==null)?it.amt*u:null;
        set("bl-u-"+b.id+"-"+idx, u===null?"단가 미입력":fmtUnit(u)+"원/g");
        set("bl-c-"+b.id+"-"+idx, lc===null?"단가 없음":won(Math.round(lc)), lc===null);
      });
    });
    var missN=0;
    Object.keys(S.ing).forEach(function(id){
      var u=unitCost(id); if(u===null) missN++;
      set("iu-"+id, fmtUnit(u), u===null);
    });

    var avg=rates.length?rates.reduce(function(a,b){return a+b;},0)/rates.length:null;
    document.getElementById("k1").innerHTML=avg===null?"—":(avg*100).toFixed(1)+'<small>%</small>';
    document.getElementById("k2").innerHTML=done+'<small>/ '+S.menu.length+'종</small>';
    document.getElementById("k2n").textContent=(S.menu.length-done)+"종은 값이 더 필요해요";
    document.getElementById("k3").innerHTML=missN+'<small>개</small>';
    document.getElementById("k4").innerHTML=hi===null?"—":(hi*100).toFixed(1)+'<small>%</small>';
    document.getElementById("k4n").textContent=hiN||"—";
    document.getElementById("k5").innerHTML=lo===null?"—":(lo*100).toFixed(1)+'<small>%</small>';
    document.getElementById("k5n").textContent=loN||"—";

    var sp=document.getElementById("spark");
    sp.innerHTML=rates.slice().sort(function(a,b){return a-b;}).map(function(r){
      return '<i class="'+tone(r)+'" style="height:'+Math.max(8,Math.min(100,r*220))+'%"></i>';
    }).join("");

    document.getElementById("c-menu").textContent=S.menu.length;
    document.getElementById("c-batch").textContent=S.batch.length;
    document.getElementById("c-ing").textContent=Object.keys(S.ing).length;
  }

  function render(){
    /* 대시보드는 메뉴 탭에서만 */
    document.getElementById("dash").hidden = (view!=="menu");
    /* 원가율순 정렬은 메뉴에만 해당 */
    document.getElementById("fSort").hidden = (view!=="menu");
    document.getElementById("view").innerHTML=
      view==="menu"?menuView():(view==="batch"?batchView():ingView());
    refresh();
  }

  /* ---------- events ---------- */
  function num(v){
    v=String(v).replace(/[,\s원]/g,"").trim();
    if(v==="") return null;
    var n=parseFloat(v);
    return isNaN(n)?null:n;
  }
  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button[data-view]"); if(!b) return;
    view=b.dataset.view; ingCat=null;
    Array.prototype.forEach.call(this.querySelectorAll("button"),function(x){
      x.setAttribute("aria-current", x===b?"true":"false"); });
    render();
  });
  document.getElementById("q").addEventListener("input",function(){ q=this.value; render(); });
  document.getElementById("fMiss").addEventListener("click",function(){
    onlyMiss=!onlyMiss; this.setAttribute("aria-pressed",onlyMiss?"true":"false"); render(); });
  document.getElementById("fSort").addEventListener("click",function(){
    sortRate=!sortRate; this.setAttribute("aria-pressed",sortRate?"true":"false"); render(); });

  var viewEl=document.getElementById("view");
  viewEl.addEventListener("click",function(e){
    var c=e.target.closest("[data-cat]");
    if(c){
      var v=c.getAttribute("data-cat");
      ingCat = v===""?null:v;
      render();
      document.getElementById("view").scrollIntoView({block:"start",behavior:"smooth"});
      return;
    }
    var t=e.target.closest("[data-tog]"); if(!t) return;
    var k=t.dataset.tog;
    open[k]=!open[k];
    var card=document.querySelector('[data-card="'+k+'"]');
    if(card){
      card.classList.toggle("on",!!open[k]);
      t.setAttribute("aria-expanded",open[k]?"true":"false");
      var more=t.querySelector(".ct-more");
      if(more) more.textContent=open[k]?"접기":(more.dataset.n||"펼치기");
    }
  });
  viewEl.addEventListener("input",function(e){
    var el=e.target; if(el.tagName!=="INPUT") return;
    var v=num(el.value), d=el.dataset;
    if(d.ip!==undefined) S.ing[d.ip].price=v;
    else if(d.iq!==undefined) S.ing[d.iq].qty=v;
    else if(d.price!==undefined) S.menu.forEach(function(m){ if(m.id===d.price) m.price=v; });
    else if(d.mi!==undefined) S.menu.forEach(function(m){ if(m.id===d.mi) m.items[+d.idx].amt=v; });
    else if(d.bi!==undefined){ var b=batchById(d.bi); if(b) b.items[+d.idx].amt=v; }
    else return;
    refresh(); save();
  });

  document.getElementById("reset").addEventListener("click",function(){
    S=seed(); open={}; save(); render(); toast("기본값으로 되돌렸어요");
  });

  S=load();
  render();
})();
</script>

</body>
</html>
